name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git for tests that use `git init`
        run: |
          git config --global user.email "ci@sentinel.test"
          git config --global user.name "Sentinel CI"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: List rules (smoke test)
        run: python -m sentinel list-rules

      - name: Run test suite
        run: python -m pytest --tb=short

      - name: Self-scan (Sentinel on Sentinel)
        run: python -m sentinel scan --repo .
