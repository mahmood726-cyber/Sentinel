name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Match pyproject.toml requires-python = ">=3.13". Older Python
        # versions would fail pip install -e ".[dev]" with a clear
        # error; limit the matrix instead of weakening the declared
        # compatibility.
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git for tests that use `git init`
        run: |
          git config --global user.email "ci@sentinel.test"
          git config --global user.name "Sentinel CI"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: List rules (smoke test)
        run: python -m sentinel list-rules

      - name: Run test suite
        run: python -m pytest --tb=short

      - name: Self-scan (Sentinel on Sentinel)
        run: python -m sentinel scan --repo .

      - name: Dependency vulnerability audit (pip-audit)
        # Surfaces known CVEs in the dependency tree. Runs on ubuntu +
        # 3.13 only (representative — same wheel set across OS/py).
        # No `--strict`: unresolvable-dep warnings don't fail the job;
        # actual CVEs do.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit --progress-spinner off
