id: P0-placeholder-hmac
severity: BLOCK
scope: repo
description: >
  Placeholder HMAC signatures shipping as real crypto. Any string
  matching SIG_RSA_SHA256_ or signature_placeholder indicates an
  unreplaced TruthCert scaffold.
pattern: 'SIG_RSA_SHA256_|signature_placeholder'
files:
  - '**/*.json'
  - '**/*.py'
  - '**/*.md'
# tests/**, **/tests/**, fixtures/**, **/fixtures/** covered by COMMON_EXCLUDES.
exclude:
  - 'docs/superpowers/specs/**'
  - 'docs/superpowers/plans/**'
  # skills/**: auto-exported documentation of Sentinel's own rules.
  # The body legitimately contains the trigger strings (SIG_RSA_SHA256_,
  # signature_placeholder) for illustration.
  - 'skills/**'
  - '**/skills/**'
  - 'sentinel/rules/**'
fix_hint: >
  Replace with a real HMAC computed from env TRUTHCERT_HMAC_KEY.
  See lessons.md#cryptography--signing-learned-2026-04-14.
source: lessons.md#cryptography--signing-learned-2026-04-14
