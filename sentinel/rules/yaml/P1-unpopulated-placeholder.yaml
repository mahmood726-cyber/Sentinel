id: P1-unpopulated-placeholder
severity: WARN
scope: repo
description: >
  Unpopulated template placeholders (Jinja braces, REPLACE_ME, TBD markers)
  should not ship in built assets per html-apps.md#safety-checks.
pattern: '\{\{-?\s*[A-Za-z_]\w*\s*(?:(?:\||\[|\.[A-Za-z_])[^}]{0,80})?\s*-?\}\}|REPLACE_ME|__PLACEHOLDER__|TBD:|XXX:'
# The `{0,80}` cap on the inner-content quantifier separates real Jinja
# expressions (typically <80 chars between the braces — even long filter
# chains rarely exceed 70) from Python f-string `{{...}}` brace-escapes
# that emit JavaScript function bodies (usually hundreds of chars between
# braces). Past incident (2026-05-07 triage): E156's
# scripts/build_showcase_v3.py contributed 297 false positives because the
# unbounded `[^}]*` matched whole `{{c.style.display=(...long JS...)}}`
# spans. The cap kills those without losing realistic Jinja coverage.
files:
  - '**/*.html'
  - '**/*.md'
  - '**/*.js'
  - '**/*.py'
# tests/**, **/tests/**, fixtures/**, **/fixtures/**, conftest.py,
# **/conftest.py, and .git/** are covered by GLOBAL_EXCLUDES +
# COMMON_EXCLUDES in sentinel/registry/yaml_loader.py.
exclude:
  - 'docs/superpowers/**'
  - 'templates/**'
  # skills/**: auto-exported documentation of Sentinel's own rules.
  # The body legitimately contains placeholder example strings
  # (REPLACE_ME, TBD, __PLACEHOLDER__) for illustration.
  - 'skills/**'
  - '**/skills/**'
  - 'sentinel/rules/**'
  # docs/index.html is Sentinel's own dashboard page, which contains
  # demonstration patterns ({{ user_name }}, REPLACE_ME, TBD:, XXX:,
  # __PLACEHOLDER__) used to illustrate what this rule catches. The
  # demo IS the documentation — excluding it prevents the rule from
  # firing on its own self-test fixture.
  - 'docs/index.html'
fix_hint: >
  Populate the placeholder or escape it before shipping. If the braces are
  intentional template syntax in a non-template file, exclude the file path
  via the rule's exclude list.
source: html-apps.md#safety-checks
